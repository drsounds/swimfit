[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swimfit"
version = "0.1.0"
description = "Local-first text anonymization for files and ZIP archives"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6.3",
    "pandas>=2.2.3",
]

[project.scripts]
swimfit = "swimfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
