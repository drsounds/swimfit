name: Build and release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install .
          python -m pip install pyinstaller
          pyinstaller --onefile --name swimler --paths src --collect-all pandas --collect-all ollama src/swimler/__main__.py
          mkdir -p dist
          cp dist/swimler /tmp/swimler
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          fpm -s dir -t deb -n swimler -v "$version" --prefix /usr/local /tmp/swimler=bin/swimler
          fpm -s dir -t rpm -n swimler -v "$version" --prefix /usr/local /tmp/swimler=bin/swimler
          mv ./*.deb ./*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: |
          python -m pip install . pyinstaller
          pyinstaller --onefile --name swimler --paths src --collect-all pandas --collect-all ollama src/swimler/__main__.py
          dotnet tool install --global wix
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          wix build installer/swimler.wxs -d Version=$version -o dist/swimler.msi
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/

  release:
    needs: [source, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: swimler-${{ github.ref_name }}-${{ github.sha }}
          name: Swimler ${{ github.ref_name }} ${{ github.sha }}
          prerelease: ${{ github.ref_name == 'develop' }}
          files: release-files/**/*
