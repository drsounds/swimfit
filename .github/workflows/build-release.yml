name: Build and release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install .
          python -m pip install pyinstaller
          pyinstaller --onefile --name swimfit --paths src --collect-all pandas --collect-all ollama src/swimfit/__main__.py
          mkdir -p dist
          cp dist/swimfit /tmp/swimfit
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          fpm -s dir -t deb -n swimfit -v "$version" --prefix /usr/local /tmp/swimfit=bin/swimfit
          fpm -s dir -t rpm -n swimfit -v "$version" --prefix /usr/local /tmp/swimfit=bin/swimfit
          mv ./*.deb ./*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install . pyinstaller
          pyinstaller --onefile --name swimfit --paths src --collect-all pandas --collect-all ollama src/swimfit/__main__.py
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/

  release:
    needs: [source, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: swimfit-${{ github.ref_name }}-${{ github.sha }}
          name: Swimfit ${{ github.ref_name }} ${{ github.sha }}
          prerelease: ${{ github.ref_name == 'develop' }}
          files: release-files/**/*

  winget:
    needs: release
    if: github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: drsounds.Swimfit
          version: ${{ steps.version.outputs.version }}
          release-tag: swimfit-${{ github.ref_name }}-${{ github.sha }}
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
